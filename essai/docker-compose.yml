name: onbora-essai

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: onbora-essai-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: onbora-essai-local-only-change-for-production
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
